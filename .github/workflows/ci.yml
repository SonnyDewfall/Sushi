name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # JACK-Client opens libjack when it is imported, and fails without it. No
      # server is needed, only the library, so the capture tests can check the
      # names the engine calls against the installed JACK-Client.
      - name: Install libjack
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libjack-jackd2-0

      # `audio` (numpy), `agent` (aiohttp) and `capture` (JACK-Client) are
      # pure-PyPI, so the signal, analysis, agent and capture tests run here
      # instead of skipping.
      - name: Install the tool with dev, audio, agent and capture extras
        run: pip install -e "tool[dev,audio,agent,capture]"

      # Slow tests are excluded on purpose: they start a real Sushi binary,
      # which this runner does not have. Tests that need python3-lilv or ./sushi
      # skip here too, and that is fine only because rig-container.yml runs the
      # whole suite in an image that has both and fails on any skip. Keep it so.
      - name: Run the fast test suite
        working-directory: tool
        run: python -m pytest -q -rs -m "not slow"
