name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # `audio` (numpy) and `agent` (aiohttp) are pure-PyPI, so the signal,
      # analysis and agent tests run here instead of skipping.
      - name: Install the tool with dev, audio and agent extras
        run: pip install -e "tool[dev,audio,agent]"

      # Slow tests are excluded on purpose: they start a real Sushi binary,
      # which this runner does not have. Tests that need python3-lilv or ./sushi
      # skip here too, and that is fine only because rig-container.yml runs the
      # whole suite in an image that has both and fails on any skip. Keep it so.
      - name: Run the fast test suite
        working-directory: tool
        run: python -m pytest -q -rs -m "not slow"
