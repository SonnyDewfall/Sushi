# Builds the "dummy rig" image (ci/Dockerfile) and runs, inside it, the checks
# that need a real Sushi: the slow pytest suite and `sushi-rig verify --all`.
# The fast suite lives in ci.yml and needs none of this.
#
# Every step that can fail puts the tail of its output into a CI annotation.
# The full log is there too, but annotations are what the check-run API returns,
# so a failure can be read and fixed without opening the log viewer.
name: rig-container

on:
  pull_request:
    paths:
      - ci/**
      - .github/workflows/rig-container.yml
      - plugin-manifest.txt
      - config/**
      - tool/**
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Where Sushi comes from. The tag is real (elk-audio/sushi has a 1.3.0 tag,
  # matching the README's "Sushi 1.3.0"); whether that release carries an
  # AppImage under this name is what the fetch step finds out, and if it does
  # not, its annotation lists what the release does carry.
  SUSHI_REPO: elk-audio/sushi
  SUSHI_TAG: "1.3.0"
  SUSHI_ASSET: Sushi-x86_64.AppImage

jobs:
  slow:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Sushi
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ci/dl
          if ! gh release download "$SUSHI_TAG" --repo "$SUSHI_REPO" \
                --pattern "$SUSHI_ASSET" --dir ci/dl 2> fetch.err; then
            assets="$(gh release view "$SUSHI_TAG" --repo "$SUSHI_REPO" \
                --json assets --jq '[.assets[].name] | join(", ")' 2>&1 || true)"
            releases="$(gh release list --repo "$SUSHI_REPO" --limit 8 2>&1 \
                | cut -f1,3 | tr '\t\n' ' ;' || true)"
            echo "::error title=Sushi fetch failed::$(tr '\n' ' ' < fetch.err) | assets on ${SUSHI_TAG}: ${assets:-none} | recent releases: ${releases:-none}"
            exit 1
          fi
          mv "ci/dl/$SUSHI_ASSET" ci/dl/Sushi.AppImage

      - name: Build the image
        run: |
          set -o pipefail
          if ! docker build --progress=plain -f ci/Dockerfile \
                --build-context sushi=ci/dl -t sushi-rig-ci . 2>&1 | tee build.log; then
            echo "::error title=Image build failed::$(tail -n 40 build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi

      - name: Slow suite
        run: |
          set -o pipefail
          if ! docker run --rm sushi-rig-ci pytest -m slow -rs 2>&1 | tee slow.log; then
            echo "::error title=Slow suite failed::$(tail -n 40 slow.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
          # test_configs.py skips itself when ./sushi or plugins/ is missing,
          # which would turn a broken image into a green run. In here nothing
          # should be missing, so any skip is a failure.
          if grep -q '^SKIPPED' slow.log; then
            echo "::error title=Slow tests were skipped::$(grep '^SKIPPED' slow.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi

      - name: verify --all
        run: |
          set -o pipefail
          if ! docker run --rm -w /rig sushi-rig-ci sushi-rig verify --all 2>&1 | tee verify.log; then
            echo "::error title=verify --all failed::$(tail -n 40 verify.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
