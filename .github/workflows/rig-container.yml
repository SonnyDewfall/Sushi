# Builds the "dummy rig" image (ci/Dockerfile) and runs, inside it, the checks
# that need a real Sushi or a system lilv: the WHOLE pytest suite and
# `sushi-rig verify --all`. ci.yml runs the fast suite on a bare runner, where
# the lilv- and Sushi-guarded tests skip; this job is the only place they run.
# Between the two workflows every test must run somewhere (README: Running the
# tests), so a test that skips here is a failure, not a footnote.
#
# Every step that can fail puts the tail of its output into a CI annotation.
# The full log is there too, but annotations are what the check-run API returns,
# so a failure can be read and fixed without opening the log viewer.
name: rig-container

on:
  pull_request:
    paths:
      - ci/**
      - .github/workflows/rig-container.yml
      - plugin-manifest.txt
      - config/**
      - tool/**
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Where Sushi comes from. elk-audio/sushi's 1.3.0 release (the README's
  # "Sushi 1.3.0") ships Linux as a zip, not as a bare AppImage: release-page
  # AppImages stop at 0.12.0. The AppImage is expected inside the zip; if it is
  # not there, the fetch step's annotation lists what the zip does contain.
  SUSHI_REPO: elk-audio/sushi
  SUSHI_TAG: "1.3.0"
  SUSHI_ASSET: sushi-linux-x86_64_1_3_0.zip

jobs:
  # The id is still `slow`: it is the check's name on the PR, so renaming it
  # would orphan any branch-protection rule that requires it.
  slow:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Sushi
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ci/dl
          if ! gh release download "$SUSHI_TAG" --repo "$SUSHI_REPO" \
                --pattern "$SUSHI_ASSET" --dir ci/dl 2> fetch.err; then
            assets="$(gh release view "$SUSHI_TAG" --repo "$SUSHI_REPO" \
                --json assets --jq '[.assets[].name] | join(", ")' 2>&1 || true)"
            releases="$(gh release list --repo "$SUSHI_REPO" --limit 8 2>&1 \
                | cut -f1,3 | tr '\t\n' ' ;' || true)"
            echo "::error title=Sushi fetch failed::$(tr '\n' ' ' < fetch.err) | assets on ${SUSHI_TAG}: ${assets:-none} | recent releases: ${releases:-none}"
            exit 1
          fi
          unzip -q "ci/dl/$SUSHI_ASSET" -d ci/dl/unzipped
          found="$(find ci/dl/unzipped -name '*.AppImage' -type f)"
          if [ "$(printf '%s' "$found" | grep -c .)" != 1 ]; then
            listing="$(cd ci/dl/unzipped && find . -maxdepth 3 | head -40 | tr '\n' ' ' || true)"
            echo "::error title=No single AppImage in the Sushi zip::found: ${found:-none} | zip contents: ${listing}"
            exit 1
          fi
          mv "$found" ci/dl/Sushi.AppImage
          rm -rf ci/dl/unzipped "ci/dl/$SUSHI_ASSET"

      - name: Build the image
        run: |
          set -o pipefail
          if ! docker build --progress=plain -f ci/Dockerfile \
                --build-context sushi=ci/dl -t sushi-rig-ci . 2>&1 | tee build.log; then
            echo "::error title=Image build failed::$(tail -n 40 build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi

      # TEMPORARY, removed before merge: isolates why guitar_vocal will not
      # render offline. Two configs by two channel counts, one variable each.
      - name: "Diagnose: offline render by channel count"
        continue-on-error: true
        run: |
          docker run --rm -w /rig sushi-rig-ci bash -c '
            echo "DIAG ===== ./sushi --help ====="; ./sushi --help 2>&1 | head -80
            /opt/venv/bin/python - <<PY
          from pathlib import Path
          import numpy as np
          from sushi_rig.render import RenderError, Stimulus, render_offline
          root = Path("/rig")
          for cfg in ("guitar_vocal", "electric_board"):
              for ch in (2, 4):
                  try:
                      out = render_offline(root / "config" / f"{cfg}.json", root,
                                           Path(f"/tmp/diag/{cfg}-{ch}"),
                                           stimulus=Stimulus(channels=ch, duration_s=1.0),
                                           sushi_bin="./sushi")
                      r = out["rendered"]
                      peaks = ", ".join(f"{20*np.log10(max(np.abs(r[:, c]).max(), 1e-12)):.1f}"
                                        for c in range(r.shape[1]))
                      print(f"DIAG {cfg} {ch}ch: OK, {out[\"channels\"]} out ch, {r.shape[0]} frames, peaks dBFS [{peaks}]")
                  except RenderError as exc:
                      print(f"DIAG {cfg} {ch}ch: FAILED {str(exc)[:400]!r}")
          PY'

      - name: Full suite
        run: |
          set -o pipefail
          if ! docker run --rm sushi-rig-ci pytest -rs 2>&1 | tee suite.log; then
            echo "::error title=Full suite failed::$(tail -n 40 suite.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
          # The guards (needs_sushi, needs_lilv, importorskip) skip themselves
          # when ./sushi, plugins/ or lilv is missing, which would turn a broken
          # image into a green run. In here nothing should be missing, so any
          # skip is a failure. Do not narrow this to `-m slow`: that is how 51
          # tests ran in neither workflow without anyone being told.
          if grep -q '^SKIPPED' suite.log; then
            echo "::error title=Tests were skipped::$(grep '^SKIPPED' suite.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi

      - name: verify --all
        run: |
          set -o pipefail
          if ! docker run --rm -w /rig sushi-rig-ci sushi-rig verify --all --sushi ./sushi 2>&1 | tee verify.log; then
            echo "::error title=verify --all failed::$(tail -n 40 verify.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi

      # #40: a change in the rig's sound fails the build. References are
      # calibrated in this container -- decided 2026-10-30, because a check CI
      # cannot run protects nothing -- so a reference describes this image's
      # plugin set, and the rig machine's own sound is selftest's to cover.
      #
      # It fingerprints Sushi's chain only. The neural amp runs in Carla outside
      # Sushi and is not in this image, so a config's `_amp` section is never
      # rendered here.
      - name: nulltest --all
        id: nulltest
        run: |
          set -o pipefail
          if ! docker run --rm -w /rig sushi-rig-ci sushi-rig nulltest --all --sushi ./sushi 2>&1 | tee nulltest.log; then
            echo "::error title=The rig's sound changed, or a config has no reference::$(tail -n 40 nulltest.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi

      # Only when the check above failed. Calibrates every config afresh and
      # hands the result back, so the person fixing the failure has the numbers
      # the render produces *now* -- as an artifact, and printed below, which is
      # how a session without the GitHub UI reads them.
      #
      # These are candidates, never committed by this job. If the sound changed
      # by accident, the fix is in the config and these are the evidence; only
      # if it changed on purpose are they the new references. Committing them is
      # the same deliberate act as running `nulltest --calibrate` by hand.
      - name: Calibrate candidate references
        if: failure() && steps.nulltest.outcome == 'failure'
        run: |
          set -o pipefail
          mkdir -p sound-candidates
          docker run --rm -w /rig -v "$PWD/sound-candidates:/rig/config/sound" \
              sushi-rig-ci sushi-rig nulltest --all --calibrate --sushi ./sushi 2>&1 | tee calibrate.log
          for f in sound-candidates/*.yaml; do
            echo "===== BEGIN ${f#sound-candidates/} ====="
            cat "$f"
            echo "===== END ${f#sound-candidates/} ====="
          done

      - name: Upload candidate references
        if: failure() && steps.nulltest.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: sound-reference-candidates
          path: sound-candidates/
          if-no-files-found: warn
