# Builds the "dummy rig" image (ci/Dockerfile) and runs, inside it, the checks
# that need a real Sushi or a system lilv: the WHOLE pytest suite and
# `sushi-rig verify --all`. ci.yml runs the fast suite on a bare runner, where
# the lilv- and Sushi-guarded tests skip; this job is the only place they run.
# Between the two workflows every test must run somewhere (README: Running the
# tests), so a test that skips here is a failure, not a footnote.
#
# Every step that can fail puts the tail of its output into a CI annotation.
# The full log is there too, but annotations are what the check-run API returns,
# so a failure can be read and fixed without opening the log viewer.
name: rig-container

on:
  pull_request:
    paths:
      - ci/**
      - .github/workflows/rig-container.yml
      - plugin-manifest.txt
      - config/**
      - tool/**
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Where Sushi comes from. elk-audio/sushi's 1.3.0 release (the README's
  # "Sushi 1.3.0") ships Linux as a zip, not as a bare AppImage: release-page
  # AppImages stop at 0.12.0. The AppImage is expected inside the zip; if it is
  # not there, the fetch step's annotation lists what the zip does contain.
  SUSHI_REPO: elk-audio/sushi
  SUSHI_TAG: "1.3.0"
  SUSHI_ASSET: sushi-linux-x86_64_1_3_0.zip

jobs:
  # The id is still `slow`: it is the check's name on the PR, so renaming it
  # would orphan any branch-protection rule that requires it.
  slow:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Sushi
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ci/dl
          if ! gh release download "$SUSHI_TAG" --repo "$SUSHI_REPO" \
                --pattern "$SUSHI_ASSET" --dir ci/dl 2> fetch.err; then
            assets="$(gh release view "$SUSHI_TAG" --repo "$SUSHI_REPO" \
                --json assets --jq '[.assets[].name] | join(", ")' 2>&1 || true)"
            releases="$(gh release list --repo "$SUSHI_REPO" --limit 8 2>&1 \
                | cut -f1,3 | tr '\t\n' ' ;' || true)"
            echo "::error title=Sushi fetch failed::$(tr '\n' ' ' < fetch.err) | assets on ${SUSHI_TAG}: ${assets:-none} | recent releases: ${releases:-none}"
            exit 1
          fi
          unzip -q "ci/dl/$SUSHI_ASSET" -d ci/dl/unzipped
          found="$(find ci/dl/unzipped -name '*.AppImage' -type f)"
          if [ "$(printf '%s' "$found" | grep -c .)" != 1 ]; then
            listing="$(cd ci/dl/unzipped && find . -maxdepth 3 | head -40 | tr '\n' ' ' || true)"
            echo "::error title=No single AppImage in the Sushi zip::found: ${found:-none} | zip contents: ${listing}"
            exit 1
          fi
          mv "$found" ci/dl/Sushi.AppImage
          rm -rf ci/dl/unzipped "ci/dl/$SUSHI_ASSET"

      - name: Build the image
        run: |
          set -o pipefail
          if ! docker build --progress=plain -f ci/Dockerfile \
                --build-context sushi=ci/dl -t sushi-rig-ci . 2>&1 | tee build.log; then
            echo "::error title=Image build failed::$(tail -n 40 build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi

      - name: Full suite
        run: |
          set -o pipefail
          if ! docker run --rm sushi-rig-ci pytest -rs 2>&1 | tee suite.log; then
            echo "::error title=Full suite failed::$(tail -n 40 suite.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
          # The guards (needs_sushi, needs_lilv, importorskip) skip themselves
          # when ./sushi, plugins/ or lilv is missing, which would turn a broken
          # image into a green run. In here nothing should be missing, so any
          # skip is a failure. Do not narrow this to `-m slow`: that is how 51
          # tests ran in neither workflow without anyone being told.
          if grep -q '^SKIPPED' suite.log; then
            echo "::error title=Tests were skipped::$(grep '^SKIPPED' suite.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi

      - name: verify --all
        run: |
          set -o pipefail
          if ! docker run --rm -w /rig sushi-rig-ci sushi-rig verify --all --sushi ./sushi 2>&1 | tee verify.log; then
            echo "::error title=verify --all failed::$(tail -n 40 verify.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
