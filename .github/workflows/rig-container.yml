# Builds the "dummy rig" image (ci/Dockerfile) and runs, inside it, the checks
# that need a real Sushi or a system lilv: the WHOLE pytest suite,
# `sushi-rig verify --all`, and `sushi-rig nulltest --all` against the sound
# references in config/sound/ and tool/tests/fixtures/sound/ (the frozen rigs',
# #144). ci.yml runs the fast suite on a bare runner, where
# the lilv- and Sushi-guarded tests skip; this job is the only place they run.
# Between the two workflows every test must run somewhere
# (docs/reference/testing.md), so a test that skips here is a failure, not a
# footnote.
#
# Every step that can fail puts the tail of its output into a CI annotation.
# The full log is there too, but annotations are what the check-run API returns,
# so a failure can be read and fixed without opening the log viewer.
name: rig-container

on:
  pull_request:
    paths:
      - ci/**
      - scripts/**
      - .github/workflows/rig-container.yml
      - plugin-manifest.txt
      - plugin-ports.txt
      - config/**
      - tool/**
      - machines/**
      - Patchbay/**
      - amp/**
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Where Sushi comes from. elk-audio/sushi's 1.3.0 release (the "Sushi 1.3.0" of
  # docs/reference/environment.md) ships Linux as a zip, not as a bare AppImage: release-page
  # AppImages stop at 0.12.0. The AppImage is expected inside the zip; if it is
  # not there, the fetch step's annotation lists what the zip does contain.
  SUSHI_REPO: elk-audio/sushi
  SUSHI_TAG: "1.3.0"
  SUSHI_ASSET: sushi-linux-x86_64_1_3_0.zip

jobs:
  # The id is still `slow`: it is the check's name on the PR, so renaming it
  # would orphan any branch-protection rule that requires it.
  slow:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Sushi
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ci/dl
          if ! gh release download "$SUSHI_TAG" --repo "$SUSHI_REPO" \
                --pattern "$SUSHI_ASSET" --dir ci/dl 2> fetch.err; then
            assets="$(gh release view "$SUSHI_TAG" --repo "$SUSHI_REPO" \
                --json assets --jq '[.assets[].name] | join(", ")' 2>&1 || true)"
            releases="$(gh release list --repo "$SUSHI_REPO" --limit 8 2>&1 \
                | cut -f1,3 | tr '\t\n' ' ;' || true)"
            echo "::error title=Sushi fetch failed::$(tr '\n' ' ' < fetch.err) | assets on ${SUSHI_TAG}: ${assets:-none} | recent releases: ${releases:-none}"
            exit 1
          fi
          unzip -q "ci/dl/$SUSHI_ASSET" -d ci/dl/unzipped
          found="$(find ci/dl/unzipped -name '*.AppImage' -type f)"
          if [ "$(printf '%s' "$found" | grep -c .)" != 1 ]; then
            listing="$(cd ci/dl/unzipped && find . -maxdepth 3 | head -40 | tr '\n' ' ' || true)"
            echo "::error title=No single AppImage in the Sushi zip::found: ${found:-none} | zip contents: ${listing}"
            exit 1
          fi
          mv "$found" ci/dl/Sushi.AppImage
          rm -rf ci/dl/unzipped "ci/dl/$SUSHI_ASSET"

      - name: Build the image
        id: build
        run: |
          set -o pipefail
          if ! docker build --progress=plain -f ci/Dockerfile \
                --build-context sushi=ci/dl -t sushi-rig-ci . 2>&1 | tee build.log; then
            echo "::error title=Image build failed::$(tail -n 40 build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi

      - name: Full suite
        run: |
          set -o pipefail
          status=0
          docker run --rm sushi-rig-ci pytest -rs 2>&1 | tee suite.log || status=$?
          # A null-test render retried after gx_detune_'s known NaN passes, and
          # says so at the end of the run, one `RETRIED-NAN:` line per retry
          # (render.RETRIED_PREFIX, conftest); this puts it on the check run
          # too, so a retry is seen every time it happens, not only when
          # something fails. Anchored, so test source and tracebacks, which
          # are indented or prefixed, cannot match.
          retries="$(grep -c '^RETRIED-NAN: ' suite.log || true)"
          if [ "$retries" -gt 0 ]; then
            echo "::warning title=${retries} render(s) retried after a NaN::$(grep '^RETRIED-NAN: ' suite.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          fi
          if [ "$status" != 0 ]; then
            echo "::error title=Full suite failed::$(tail -n 40 suite.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
          # The guards (needs_sushi, needs_lilv, importorskip) skip themselves
          # when ./sushi, plugins/ or lilv is missing, which would turn a broken
          # image into a green run. In here nothing should be missing, so any
          # skip is a failure. Do not narrow this to `-m slow`: that is how 51
          # tests ran in neither workflow without anyone being told.
          if grep -q '^SKIPPED' suite.log; then
            echo "::error title=Tests were skipped::$(grep '^SKIPPED' suite.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi

      - name: verify --all
        run: |
          set -o pipefail
          if ! docker run --rm -w /rig sushi-rig-ci sushi-rig verify --all --sushi ./sushi 2>&1 | tee verify.log; then
            echo "::error title=verify --all failed::$(tail -n 40 verify.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi

      # #40: a change in the rig's sound fails the build. References are
      # calibrated in this container -- decided 2026-10-30, because a check CI
      # cannot run protects nothing -- so a reference describes this image's
      # plugin set, and the rig machine's own sound is selftest's to cover.
      #
      # #144: what fails and what only warns. The frozen rigs' references
      # (tool/tests/fixtures/sound/) and the v1 configs' (`.v1-mono`) are held
      # exactly: a change of sound, a missing reference or an orphan fails. A
      # committed rig (config/rigs/, the owner's, saved from the page) is
      # compared exactly while its reference was made from the rig as it is
      # (`made_from` in the reference, a hash of the parsed rig file); one
      # that has changed, or has no reference, is STALE: rendered and held to
      # being finite, two-sided and balanced, and then a warning, with its
      # candidate reference attached, not a failure. A committed rig's
      # orphaned reference is a warning too. Any rig whose render is NaN,
      # silent or one-sided fails, whatever its reference says.
      #
      # It fingerprints Sushi's chain only. The neural amp runs in Carla outside
      # Sushi and is not in this image, so a config's `_amp` section is never
      # rendered here.
      # Runs whether or not the suite passed, once the image is built: the
      # sound check and the candidate references below are their own answer,
      # and a failing test is no reason to hide them. Without this, a change
      # meant to change the sound (a reference to recalibrate) could never
      # get its candidates from CI while any test that reads that reference
      # failed first (2026-11-02, the copies to stereo).
      - name: nulltest --all
        id: nulltest
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -o pipefail
          # What the references depend on beyond this repository, printed so a
          # failure on a PR that changed no config can be traced. The image is
          # rebuilt each run from a floating ubuntu:24.04 and unpinned plugin
          # packages, so an upstream update changes the sound being checked;
          # and runners differ in CPU, which can take plugins down different
          # floating-point paths. Neither is pinned: this makes them visible.
          docker run --rm sushi-rig-ci bash -c '
            grep -m1 "model name" /proc/cpuinfo
            dpkg-query -W -f="\${Package} \${Version}\n" guitarix-lv2 mda-lv2 \
                dpf-plugins-lv2 x42-plugins zynaddsubfx-lv2 rubberband-lv2 swh-lv2 \
                ardour-lv2-plugins calf-plugins abgate libc6 libfftw3-double3 libsamplerate0
            # plugins/ has Rubber Band 4.0.0, built (#164), not the package above,
            # and string-machine chorus, built (#177), from no package.
            cat /rig/plugins/rubberband.lv2/BUILT-FROM
            cat /rig/plugins/string-machine-chorus.lv2/BUILT-FROM'
          # Made here, so the runner owns it; nulltest writes a candidate into
          # it for each STALE channel (`--candidates`), and only for those.
          mkdir -p stale-candidates
          status=0
          docker run --rm -w /rig -v "$PWD/stale-candidates:/candidates" sushi-rig-ci \
              sushi-rig nulltest --all --sushi ./sushi --candidates /candidates 2>&1 \
              | tee nulltest.log || status=$?
          # nulltest's summary prints one `RETRIED-NAN:` line per retry, and
          # only the summary does; the lines beside each channel are not counted.
          retries="$(grep -c '^RETRIED-NAN: ' nulltest.log || true)"
          if [ "$retries" -gt 0 ]; then
            echo "::warning title=nulltest: ${retries} render(s) retried after a NaN::$(grep '^RETRIED-NAN: ' nulltest.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          fi
          # The warnings, each a line of the summary alone (`nulltest.STALE_PREFIX`,
          # `ORPHAN_PREFIX`). A STALE one names the channel, says why, and
          # carries the candidate to commit as config/sound/<name>.yaml: in
          # the annotation, printed below, and in the stale-sound-references
          # artifact. Committing it is the same deliberate act as running
          # `nulltest --calibrate` by hand: read it first.
          stale="$(grep -c '^STALE-REFERENCE: ' nulltest.log || true)"
          if [ "$stale" -gt 0 ]; then
            body="$(grep '^STALE-REFERENCE: ' nulltest.log
                    for f in stale-candidates/*.yaml; do
                      [ -e "$f" ] || continue
                      echo "===== BEGIN config/sound/${f#stale-candidates/} ====="
                      cat "$f"
                      echo "===== END config/sound/${f#stale-candidates/} ====="
                    done)"
            printf '%s\n' "$body"
            names="$(grep '^STALE-REFERENCE: ' nulltest.log | cut -d' ' -f2 | tr -d ':' | tr '\n' ' ')"
            # The names go in the message, not the title: a workflow command's
            # properties are split on `,` and end at `::`, so a title holds
            # neither (review of PR #158; test_sound_refs.py parses it so).
            body="$(printf 'Held to the generic checks only, with no reference made from the rig as it is: %s\n%s' \
                "$names" "$body")"
            echo "::warning title=${stale} rig channel(s) STALE::$(printf '%s\n' "$body" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          fi
          orphans="$(grep -c '^ORPHANED-REFERENCE: ' nulltest.log || true)"
          if [ "$orphans" -gt 0 ]; then
            echo "::warning title=${orphans} orphaned reference(s) of committed rigs::$(grep '^ORPHANED-REFERENCE: ' nulltest.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          fi
          if [ "$status" != 0 ]; then
            # Neutral on purpose: this fails on a changed sound, a missing
            # reference, a config that cannot be rendered or checked, and one
            # that stopped being renderable. The log line says which.
            echo "::error title=nulltest --all failed::$(tail -n 40 nulltest.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi

      - name: Upload the stale rigs' candidate references
        if: ${{ !cancelled() && hashFiles('stale-candidates/*.yaml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: stale-sound-references
          path: stale-candidates/
          if-no-files-found: ignore

      # Only when the check above failed. Calibrates every config afresh and
      # hands the result back, so the person fixing the failure has the numbers
      # the render produces *now* -- as an artifact, and printed below, which is
      # how a session without the GitHub UI reads them.
      #
      # These are candidates, never committed by this job. If the sound changed
      # by accident, the fix is in the config and these are the evidence; only
      # if it changed on purpose are they the new references. Committing them is
      # the same deliberate act as running `nulltest --calibrate` by hand.
      - name: Calibrate candidate references
        if: failure() && steps.nulltest.outcome == 'failure'
        run: |
          set -o pipefail
          mkdir -p sound-candidates
          # Start from the committed references, so a recalibration keeps any
          # tolerance set wider by hand (`nulltest.keep_wider`). An empty
          # directory here used to throw those away: committing the candidates
          # put the non-deterministic configs back to failing at random.
          cp config/sound/*.yaml sound-candidates/ 2>/dev/null || true
          # The frozen rigs' too (#144), beside them: if a change to the code or
          # a plugin moved a frozen rig's sound ON PURPOSE, these are its new
          # references, committed under tool/tests/fixtures/sound/ with their
          # new sha256 in test_rig_fixtures.py's CHECKSUMS, in the same commit.
          mkdir -p sound-candidates/frozen
          cp tool/tests/fixtures/sound/*.yaml sound-candidates/frozen/ 2>/dev/null || true
          echo "These are candidates for a change in sound that was MEANT. If"
          echo "nulltest reported CANNOT CHECK or NO LONGER RENDERABLE, or if this"
          echo "PR changed no config, they are not the fix: read nulltest's output."
          # Status kept, not acted on, until every candidate is printed. With
          # `bash -e` a single config that cannot calibrate used to end the
          # step there, and the candidates for every other config went with it.
          status=0
          docker run --rm -w /rig -v "$PWD/sound-candidates:/rig/config/sound" \
              -v "$PWD/sound-candidates/frozen:/rig/tool/tests/fixtures/sound" \
              sushi-rig-ci sushi-rig nulltest --all --calibrate --sushi ./sushi 2>&1 \
              | tee calibrate.log || status=$?
          for f in sound-candidates/*.yaml sound-candidates/frozen/*.yaml; do
            [ -e "$f" ] || continue
            echo "===== BEGIN ${f#sound-candidates/} ====="
            cat "$f"
            echo "===== END ${f#sound-candidates/} ====="
          done
          exit "$status"

      - name: Upload candidate references
        if: failure() && steps.nulltest.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: sound-reference-candidates
          path: sound-candidates/
          if-no-files-found: warn
