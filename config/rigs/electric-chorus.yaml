# Converted from config/electric-chorus.json by `sushi-rig convert`, and checked to compile
# back to every plugin and setting it held. Edit this file, not that one.

kind: rig
schema_version: 1
name: electric-chorus
description: Electric guitar — compressor, overdrive, octave, EQ, chorus, delay, and two reverbs — a clean
  room and a big hall
meta:
  version: '1.0'
  status: stable
  source: config/src/electric_board.yaml
host:
  samplerate: 48000
amp:
  plugin: nam
  model: amp/models/Neve 2.nam
  parameters:
    Input Lvl: 0.0
    Output Lvl: -0.4
    Quality: 1.0
channels:
- name: board
  input: guitar-in
  width: mono
  strip:
    gain: 0.833333
    pan: 0.5
    mute: 0.0
  chain:
  - name: compressor
    uri: http://guitarix.sourceforge.net/plugins/gx_compressor#_compressor
    bypassed: false
    parameters:
      RATIO: 0.07
      KNEE: 0.1
      THRESHOLD: 0.74
      RELEASE: 0.05
      ATTACK: 0.002
      BYPASS: 1.0
  - name: eq
    uri: http://distrho.sf.net/plugins/3BandEQ
    bypassed: false
    parameters:
      Low: 0.41
      Mid: 0.56
      High: 0.26
      Master: 0.5
      Low-Mid Freq: 0.48
      Mid-High Freq: 0.06
  - name: chorus
    uri: http://guitarix.sourceforge.net/plugins/gx_chorus_stereo#_chorus_stereo
    bypassed: false
    parameters:
      Level: 0.91
      Delay: 0.5
      Depth: 0.03
      Freq: 0.08
      BYPASS: 1.0
  - name: octave
    uri: http://guitarix.sourceforge.net/plugins/gx_oc_2_#_oc_2_
    bypassed: true
    parameters:
      DIRECT: 0.25
      OCTAVE1: 0.47
      OCTAVE2: 0.0
  - name: overdrive
    uri: http://guitarix.sourceforge.net/plugins/gxts9#ts9sim
    bypassed: true
    parameters:
      Level: 0.93
      Tone: 0.13
      Drive: 0.0
      BYPASS: 1.0
  - name: delay
    uri: http://drobilla.net/plugins/mda/Delay
    bypassed: true
    parameters:
      L Delay: 0.52
      R Delay: 0.53
      Feedback: 0.66
      Fb Tone: 0.5
      FX Mix: 0.77
      Output: 0.73
  - name: hall
    uri: http://distrho.sf.net/plugins/MaGigaverb
    bypassed: true
    parameters:
      damping: 0.0
      revtime: 0.01
      roomsize: 0.29
      spread: 0.01
      bandwidth: 0.62
      tail: 0.09
      dry: 0.81
      early: 0.16
  - name: room
    uri: urn:ardour:a-reverb
    bypassed: false
    parameters:
      Blend: 0.2
      Room Size: 0.41
      Enable: 1.0
master:
  output: monitor-out
  chain: []
