# Hand-authored source for config/electric_board.json.
#
# Emit with:
#   tool/.venv/bin/sushi-rig emit config/src/electric_board.yaml \
#     -o config/electric_board.json
#   tool/.venv/bin/sushi-rig emit config/src/electric_board.yaml \
#     --state <captured>.json -o config/electric_board.json   # after tweak + capture
#
# Plugin parameter values are never written here. They live in initial_state,
# generated from a captured live session — or, as on the first emit, left out
# entirely so every plugin starts at its own TTL-declared defaults.
#
# Plugins are named by ROLE, not by vendor id. The name below becomes Sushi's
# processor name, which becomes both the OSC path prefix and the panel's tab
# label — "overdrive" is a far more usable tab than "gxts9".
#
# The set is deliberately simple: eight plugins, ~41 parameters in total. The
# rig this replaced used three LSP plugins and produced ~130 panel faders.
# Every plugin here is control-port-only (no atom ports), so none of them keep
# state outside the config — nothing needs a file loaded, and nothing depends
# on the LV2 patch: extension that Sushi doesn't support.

meta:
  name: electric_board
  version: "1.0"
  description: Electric guitar — compressor, overdrive, octave, EQ, chorus, delay,
    and two reverbs being auditioned against each other
  status: wip

host:
  samplerate: 48000

tracks:
  - name: board
    channels: 2
    inputs:
      - engine_bus: 0
        track_bus: 0
    outputs:
      - engine_bus: 0
        track_bus: 0
    plugins:
      # Conventional pedalboard order: dynamics and dirt first, tone shaping
      # in the middle, time-based effects last.
      - name: compressor
        type: lv2
        uri: http://guitarix.sourceforge.net/plugins/gx_compressor#_compressor
      - name: overdrive
        type: lv2
        uri: http://guitarix.sourceforge.net/plugins/gxts9#ts9sim
      - name: octave
        type: lv2
        uri: http://guitarix.sourceforge.net/plugins/gx_oc_2_#_oc_2_
      - name: eq
        type: lv2
        uri: http://distrho.sf.net/plugins/3BandEQ
      - name: chorus
        type: lv2
        uri: http://guitarix.sourceforge.net/plugins/gx_chorus_stereo#_chorus_stereo
      - name: delay
        type: lv2
        uri: http://drobilla.net/plugins/mda/Delay
      # Two reverbs, in series, for auditioning against each other — untick
      # one plugin's "Active" box in the panel to hear the other on its own.
      #
      # These two break the name-by-role rule above, deliberately: with two
      # plugins filling the same role, the vendor name is the only thing that
      # distinguishes the tabs. Rename the survivor to "reverb" once one wins.
      #
      # They replace mda Ambience, which was measured and found unusable: its
      # entire impulse response dies in about 11 ms, so there is no tail for its
      # Size control to lengthen, and Size read as a broken control because of
      # it. Both of these decay for around a second or more.
      - name: gigaverb
        type: lv2
        uri: http://distrho.sf.net/plugins/MaGigaverb
      # Convolution, with seven baked-in impulse responses selected by "Room"
      # — hence the 11 MB binary. Still config-drivable: the IR choice is an
      # ordinary control port, not a file it has to load.
      - name: zamverb
        type: lv2
        uri: urn:zamaudio:ZamVerb
