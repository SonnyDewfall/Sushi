# Channel preset string-octave: the string machine's octave channel (#177),
# config/rigs/string-machine.yaml's `octave`: Rubber Band 4.0 an octave up,
# fully wet, about 67 ms behind the pick, into a swell (abGate, bypassed), the
# ensemble and a hall. Meant beside a channel of the dry guitar on the same
# input (string-ensemble, say), at -3 dB under it, which is this preset's level.

kind: channel
schema_version: 1
name: string-octave
description: An octave up into the string machine — to sit beside the dry guitar's channel
width: mono
level: -3.0
chain:
- name: octave_compressor
  uri: http://guitarix.sourceforge.net/plugins/gx_compressor#_compressor
  bypassed: false
  parameters:
    RATIO: 0.157895
    KNEE: 0.15
    THRESHOLD: 0.622642
    RELEASE: 0.03
    ATTACK: 0.005
    BYPASS: 1.0
- name: octave_up
  uri: http://breakfastquay.com/rdf/lv2-rubberband#livemono
  bypassed: false
  parameters:
    Cents: 0.5
    Semitones: 0.5
    Octaves: 0.75
    Formant Preserving: 0.0
    Wet-Dry Mix: 0.0
- name: octave_swell
  uri: http://hippie.lt/lv2/gate
  bypassed: true
  parameters:
    Switch: 1.0
    Threshold: 0.304878
    Attack: 1.0
    Hold: 0.015025
    Decay: 0.098874
    Range: 0.0
- name: octave_ensemble
  uri: http://jpcima.sdf1.org/lv2/string-machine-chorus
  bypassed: false
  parameters:
    Enabled: 1.0
    Chorus global depth: 1.0
    Chorus rate 1: 0.472433
    Chorus depth 1: 0.3071
    Chorus rate 2: 0.4725
    Chorus depth 2: 0.9055
    Chorus model: 1.0
    Wet gain: 0.7125
    Dry gain: 0.0
- name: octave_hall
  uri: http://guitarix.sourceforge.net/plugins/gx_zita_rev1_stereo#_zita_rev1_stereo
  bypassed: false
  parameters:
    LEVEL: 0.9375
    EQ2_FREQ: 0.136179
    EQ1_LEVEL: 0.5
    EQ1_FREQ: 0.111789
    IN_DELAY: 0.25
    LOW_RT60: 0.571429
    LF_X: 0.157895
    HF_DAMPING: 0.20436
    MID_RT60: 0.571429
    DRY_WET_MIX: 0.35
    EQ2_LEVEL: 0.5
