# The XPS 9320's ports. The only file in the repository that names physical
# hardware; everything else addresses a role.
#
# Written from a real `pw-dump` of this machine with the rig running — the same
# capture that lives at tool/tests/fixtures/pw-dump-rig.json — rather than from
# memory of what the interface has. Three things it settles:
#
# - the input profile in use is "Multichannel", which presents ten capture
#   ports, AUX0 to AUX9: two analogue, then the optical pairs;
# - the output profile is "Analog Surround 4.0", whose ports are FL/FR/RL/RR
#   and *not* playback_AUX0/1 — the committed example guessed AUX and would
#   have resolved to nothing here;
# - the ALSA profile itself is deliberately absent below. It is what changed
#   under the old hand-wired patchbay, and the live graph supplies it.
#
# Validate with `sushi-rig machine check`, which defaults to this file on this
# machine. Regenerate the patchbay with
# `sushi-rig patchbay generate config/src/guitar_vocal.yaml -o Patchbay/rig.qpwgraph`.
schema_version: 1
interface: Audient iD14   # informational: for whoever reads this next
roles:
  # The guitar, on the first analogue input. Verified by ear: before this file
  # existed the patchbay wired AUX0 to Sushi's input 0 alone, and the guitar
  # came out of the left speaker only.
  #
  # `mono_to_stereo` is what centres it — one port into both halves of bus 0.
  # Declared rather than inferred from the port count, because the dead `Pro`
  # profile duplicated and the live `Multichannel` profile does not.
  guitar-in:
    ports: ["Audient iD14:capture_AUX0"]
    mono_to_stereo: true
  # The vocal mic, on the second analogue input. Mic gain and phantom power are
  # the interface's business, not the rig's.
  vocal-in:
    ports: ["Audient iD14:capture_AUX1"]
    mono_to_stereo: true
  # The monitors. Left then right, in that order — the pairing is positional.
  monitor-out: ["Audient iD14:playback_FL", "Audient iD14:playback_FR"]

# MIDI controllers (#34). The rig's `midi:` section names a control here, so
# the same rig file works on another machine with other pedals. Facts measured
# with `aseqdump` on 2026-11-01 (RESULTS-hear-v2-2026-11-01.md, step 3b):
# the Akai MPD218's pads send Note on/off on channel 0 (notes 36, 38, 40, 41
# were pressed), a knob sends CC 3 with full 0 to 127 travel, and holding a
# pad also sends channel aftertouch, which a mapping must ignore. The real
# footswitch and expression pedal were not attached; when they are, they get
# their own entry here and the rig names their controls instead.
controllers:
  mpd218:
    port: "MPD218:MPD218 Port A"   # as `aseqdump -l` and PipeWire list it
    channel: all
    controls:
      knob1: {cc: 3}
      pad1: {note: 36}
      pad2: {note: 38}
      pad3: {note: 40}
      pad4: {note: 41}
  # The Line 6 FBV Express MkII (#191). Every value in this entry is
  # unverified: check with aseqdump when the pedal arrives. Nothing of the
  # board has been seen on the rig: the port name is the Linux USB-MIDI
  # driver's usual "<device> MIDI 1" form for its first USB Out port (Line 6:
  # controls send on Out Port 1; FBV Control talks on Port 4, which is not
  # this one); the channel is Line 6's default, MIDI channel 1, counted from
  # 0 here; the switch CCs are placeholders (20 to 23 are undefined in the
  # MIDI spec and clash with nothing), since the factory ones were not found;
  # "momentary" is a guess, as FBV Control sets each switch to Single, Toggle
  # or Momentary and the factory setting was not found (a Toggle switch is
  # `behaviour: latching`); CC 7 for the pedal is from Line 6's Shortboard
  # examples. Check it with `aseqdump -l` (the port's name) and
  # `aseqdump -p "<that name>"` (each switch pressed once slowly, then
  # twice; the pedal heel to toe): docs/reference/midi.md says how.
  # A and B step to the previous and next rig on every rig (their job);
  # C, D and the pedal are what a rig's midi: assigns.
  fbv:                                                 # unverified: check with aseqdump when the pedal arrives
    type: pedal
    port: "FBV Express Mk II:FBV Express Mk II MIDI 1" # unverified: check with aseqdump when the pedal arrives
    channel: 0                                         # unverified: check with aseqdump when the pedal arrives
    controls:
      a: {cc: 20, kind: switch, behaviour: momentary, job: previous-rig}  # unverified: check with aseqdump when the pedal arrives
      b: {cc: 21, kind: switch, behaviour: momentary, job: next-rig}      # unverified: check with aseqdump when the pedal arrives
      c: {cc: 22, kind: switch, behaviour: momentary}                     # unverified: check with aseqdump when the pedal arrives
      d: {cc: 23, kind: switch, behaviour: momentary}                     # unverified: check with aseqdump when the pedal arrives
      pedal: {cc: 7, kind: expression, range: [0, 127]}                   # unverified: check with aseqdump when the pedal arrives
