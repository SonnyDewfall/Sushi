# The loopback test's ports: the rig's inputs are generated tones, never the
# interface's own inputs.
#
# For `tool/spikes/live_rig/stereo_check.py rig`, with the iD14's outputs cabled
# back into its inputs (Output 1 -> Input 1, Output 2 -> Input 2). With the real
# machine file the guitar input would be the loop's return and the rig would
# feed itself. Here the guitar and the vocal are each a tone of their own pitch
# from `stereo_check.py tones`, which must be running before the rig starts,
# and the interface's inputs are linked to nothing but the test's recorder.
#
#     python3 -I tool/spikes/live_rig/stereo_check.py tones &
#     sushi-rig up --rig guitar_vocal --machine machines/loopback-test.yaml --direct --headless --no-tuner --no-amp
#     python3 -I tool/spikes/live_rig/stereo_check.py rig --label "what this run is"
#
# Not a machine: never the default for any hostname.
schema_version: 1
interface: Audient iD14 through a loopback, inputs replaced by test tones
roles:
  guitar-in:
    ports: ["stereo-check-guitar:output_MONO"]
    mono_to_stereo: true
  vocal-in:
    ports: ["stereo-check-vocal:output_MONO"]
    mono_to_stereo: true
  # The monitors, as on the real machine. Left then right.
  monitor-out: ["Audient iD14:playback_FL", "Audient iD14:playback_FR"]

# MIDI controllers (#34). The rig's `midi:` section names a control here, so
# the same rig file works on another machine with other pedals. Facts measured
# with `aseqdump` on 2026-11-01 (RESULTS-hear-v2-2026-11-01.md, step 3b):
# the Akai MPD218's pads send Note on/off on channel 0 (notes 36, 38, 40, 41
# were pressed), a knob sends CC 3 with full 0 to 127 travel, and holding a
# pad also sends channel aftertouch, which a mapping must ignore. The real
# footswitch and expression pedal were not attached; when they are, they get
# their own entry here and the rig names their controls instead.
controllers:
  mpd218:
    port: "MPD218:MPD218 Port A"   # as `aseqdump -l` and PipeWire list it
    channel: all
    controls:
      knob1: {cc: 3}
      pad1: {note: 36}
      pad2: {note: 38}
      pad3: {note: 40}
      pad4: {note: 41}
