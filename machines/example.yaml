# A worked example of a machine file, and the only thing here that names
# physical ports. Copy it to machines/<hostname>.yaml (`hostname` prints the
# name) and edit the ports. Nothing else in the repository should name a device.
#
# Ports are written as qpwgraph shows them, <client>:<port>. The device's ALSA
# *profile* ("Multichannel", "Pro", ...) is deliberately absent: it is what
# changed under the old hand-wired patchbay, and the live graph supplies it.
#
# This is a pattern, not this rig's file. It was written without access to the
# rig machine, so check the capture_AUX numbering against a live graph before
# trusting it.
#
# Validate with `sushi-rig machine check machines/example.yaml`.
schema_version: 1
interface: Audient iD14   # informational: for whoever reads this next
roles:
  # A role with one port feeding a stereo bus is an error unless it says it
  # means to feed both halves. That is stated, not guessed from the port count:
  # the rig's live profile wires one input per channel, and only a dead one
  # duplicated.
  guitar-in:
    ports: ["Audient iD14:capture_AUX0"]
    mono_to_stereo: true
  vocal-in:
    ports: ["Audient iD14:capture_AUX1"]
    mono_to_stereo: true
  # The plain list form: two ports, left then right.
  monitor-out: ["Audient iD14:playback_AUX0", "Audient iD14:playback_AUX1"]

# MIDI controllers (#34, #191): a rig's midi: names a control here, so the
# same rig file works on another machine with other pedals. A controller with
# a `type` describes each control's kind (switch or expression), how a switch
# behaves (momentary, single or latching), a pedal's travel, and a job the device does
# on every rig (previous-rig, next-rig). See docs/reference/machine-file.md.
controllers:
  # The Line 6 FBV Express MkII (#191), as aseqdump heard it on the laptop on
  # 2026-11-22. Out of the box its switches send MMC transport SysEx and its
  # pedal nothing, so it was set up in Line 6's FBV Control (Windows):
  # machines/fbv/sushi-rig-line-6.fbv is that setup, to load into FBV Control
  # if the board is ever reset. Everything arrives on its first port, channel
  # 1 (0 here); ports 2 to 4 are silent. A and B step to the previous and next
  # rig on every rig (their job); C, D, the pedal, the wah and the toe switch
  # are what a rig's midi: assigns.
  fbv:   # checked with aseqdump on the laptop, 2026-11-22; set up in FBV Control as machines/fbv/sushi-rig-line-6.fbv
    type: pedal
    port: "FBV Express Mk II:FBV Express Mk II MIDI 1"
    channel: 0
    controls:
      # A to D, as FBV Control's "Momentary" sets them, send CC n = 0 on a
      # press and CC 0 = 0 on release (no 127 at all), so a press is any
      # message on the switch's own CC: single. Setting the press value to
      # 127 and the release to the same CC in FBV Control should make them
      # momentary proper (not tried).
      a: {cc: 20, kind: switch, behaviour: single, job: previous-rig}
      b: {cc: 21, kind: switch, behaviour: single, job: next-rig}
      c: {cc: 22, kind: switch, behaviour: single}
      d: {cc: 23, kind: switch, behaviour: single}
      # The pedal is two, by the toe switch's mode: Vol sends CC 7, Wah CC 11.
      # The heel rests at 8 to 13, never 0 (14 to 17 just after a move): the
      # agent silences a volume at or below 15.
      pedal: {cc: 7, kind: expression, range: [15, 127]}
      wah: {cc: 11, kind: expression, range: [15, 127]}
      # The toe switch toggles 127 / 0, one message a press, and flips the
      # pedal between Vol and Wah as it does.
      toe: {cc: 43, kind: switch, behaviour: latching}
