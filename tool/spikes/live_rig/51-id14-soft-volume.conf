# The iD14's volume is done in software, and its hardware control is left alone.
#
# On a freshly plugged iD14 MKI, ALSA's `Speaker Playback Volume` attenuates the
# right main output only; the left ignores it. PipeWire drives that control from
# its sink volume by default, so any volume under 100% turned the right side
# down alone and the rig came out left-only. Measured through a loopback on
# 2026-11-12: RESULTS-loopback-2026-11-12.md, with stereo_check.py.
#
# With this rule PipeWire scales the samples itself, both sides alike, and never
# writes the hardware control. The control itself must sit at 0 dB:
#
#     amixer -c <card> cset name='Speaker Playback Volume' 127,127,127,127
#
# Install (WirePlumber 0.5):
#
#     mkdir -p ~/.config/wireplumber/wireplumber.conf.d
#     cp 51-id14-soft-volume.conf ~/.config/wireplumber/wireplumber.conf.d/
#     systemctl --user restart wireplumber
#
# Do not combine a high sink volume with `idctl apply daw`: that routing
# bypasses the monitor knob, so the sink volume is then the only level control.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.usb-Audient_Audient_iD14*" }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]
