[project]
name = "sushi-rig"
version = "0.1.0"
description = "Author an LV2 rig live in Sushi, then capture it back as a config file."
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "ruamel.yaml>=0.19,<0.20",  # round-trip writes, so comments survive (rigfile.write_rig); yamlmerge.py relies on 0.19's comment layout
]

[project.optional-dependencies]
live = ["elkpy", "python-osc"]
audio = ["numpy>=1.24"]  # offline signal generation and analysis (signals, analysis)
probe = []  # lilv has no PyPI wheel; install python3-lilv via apt (see README)
# The rig agent (#29): `sushi-rig agent`. python-osc too: the agent sets the amp
# in Carla over OSC itself (amp_live.py), with no listener in between.
agent = ["aiohttp>=3.9", "python-osc"]
# The agent's MIDI listener (#34, #93): pedals on bypass, Program Change rig switching.
# alsa-midi talks to the ALSA sequencer and needs libasound at run time (apt: libasound2t64);
# chosen over mido + python-rtmidi, which had no wheel past CPython 3.12 (midi_listener.py says why).
midi = ["alsa-midi>=1.0.4,<2"]
# The capture engine (#53, capture.py). Needs libjack on the machine as well (apt: libjack-jackd2-0),
# and numpy for the block buffers. Only 0.5.7 has been checked: capture.py's names are tested against it.
capture = ["JACK-Client>=0.5.7,<0.6", "numpy>=1.24"]
dev = ["pytest>=7.0"]
# The web UI's browser tests (#31, tests/test_ui.py). The package brings no browser: after
# installing, `python -m playwright install chromium` fetches the one this version drives
# (add --with-deps on a bare Ubuntu for its system libraries). The UI itself needs none of this.
ui-test = ["playwright>=1.49,<2"]

[project.scripts]
sushi-rig = "sushi_rig.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# The web UI's files (#31) are served from the package, so a wheel must carry them.
[tool.setuptools.package-data]
sushi_rig = ["ui/static/*.html", "ui/static/*.css", "ui/static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The deep config checks each start a real Sushi and take about six seconds.
# Run the fast suite with:  pytest -m "not slow"
markers = ["slow: starts a real Sushi and takes seconds, not milliseconds"]
# A misspelt marker (`@pytest.mark.slwo`) is otherwise a warning on a test that
# then runs in the fast suite, or is excluded from the slow one, unnoticed.
addopts = "--strict-markers"
