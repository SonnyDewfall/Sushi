    scale: {value: linear, provenance: fact}
    control: {value: knob, provenance: draft}
    phone: {value: 1, provenance: draft}

  - name: Tone
    symbol: fslider1_
    facts:
      min: 100.0
      max: 1000.0
      default: 400.0
      toggled: false
      integer: false
      enumeration: false
      logarithmic: false
      settable: true
