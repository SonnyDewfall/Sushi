      toggled: false
      integer: false
      enumeration: false
      logarithmic: false
      settable: true
    visibility: {value: advanced, provenance: draft}
    group: {value: gate, provenance: draft}
    order: {value: 2, provenance: draft}
    label: {value: Close, provenance: draft}
    description:
      value: How slowly it shuts once a note falls under the threshold; the range suggests ms.
      provenance: draft
    scale: {value: linear, provenance: draft}
    control: {value: knob, provenance: draft}

  - name: Hold
    symbol: hold
    facts:
      min: 5.0
