    scale: {value: log, provenance: draft}
    control: {value: knob, provenance: draft}
    phone: {value: 1, provenance: draft}

  - name: WIDTH
    symbol: width
    facts:
      min: 0.0
      max: 10.0
      default: 5.0
      toggled: false
      integer: false
      enumeration: false
      logarithmic: false
      settable: true
